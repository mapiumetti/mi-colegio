name: APK de Android

# Compila el APK de la app en cada cambio a main y lo publica como "Release"
# para descargarlo directo desde el celular.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (TypeScript)
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk mi-colegio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-colegio-apk
          path: mi-colegio.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" mi-colegio.apk \
            --title "Mi Colegio $TAG" \
            --notes "APK para Android. Descargalo desde el celular y abrilo para instalar (si te lo pide, permití instalar apps de origen desconocido)." \
            --latest

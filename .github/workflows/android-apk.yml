name: APK de Android

# Compila el APK de la app en cada cambio a main y lo publica como "Release"
# para descargarlo directo desde el celular.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (TypeScript)
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mi-colegio.keystore"
            echo "MI_COLEGIO_KEYSTORE=$RUNNER_TEMP/mi-colegio.keystore" >> "$GITHUB_ENV"
            echo "Se firma con la clave propia de Mi Colegio."
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64: el APK se firma con la clave de prueba."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          MI_COLEGIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MI_COLEGIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk mi-colegio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mi-colegio-apk
          path: mi-colegio.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" mi-colegio.apk \
            --title "Mi Colegio $TAG" \
            --notes "APK para Android. Descargalo desde el celular y abrilo para instalar (si te lo pide, permití instalar apps de origen desconocido)." \
            --latest
